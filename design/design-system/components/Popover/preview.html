<!doctype html>
<html>
<head><meta charset="utf-8"><title>Popover — preview</title></head>
<body style="margin:0">
<div class="saa-ui" style="padding:16px;background:var(--saa-bg-app);min-height:100%;box-sizing:border-box"><div class="saa-popover" style="width:360px"><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--saa-space-6)"><button class="saa-tile is-compact"><span style="height:44px;display:grid;place-items:center;color:var(--saa-muted2)"><span style="display:block;width:28px;height:28px;border:1.5px solid currentColor;border-radius:var(--saa-radius-2);box-sizing:border-box"></span></span><span class="saa-tile-label">1:1</span><span class="saa-tile-meta">1024 × 1024</span></button><button class="saa-tile is-compact"><span style="height:44px;display:grid;place-items:center;color:var(--saa-muted2)"><span style="display:block;width:22px;height:28px;border:1.5px solid currentColor;border-radius:var(--saa-radius-2);box-sizing:border-box"></span></span><span class="saa-tile-label">4:5</span><span class="saa-tile-meta">912 × 1144</span></button><button class="saa-tile is-compact"><span style="height:44px;display:grid;place-items:center;color:var(--saa-muted2)"><span style="display:block;width:21px;height:28px;border:1.5px solid currentColor;border-radius:var(--saa-radius-2);box-sizing:border-box"></span></span><span class="saa-tile-label">3:4</span><span class="saa-tile-meta">888 × 1184</span></button><button class="saa-tile is-compact" aria-pressed="true"><span style="height:44px;display:grid;place-items:center;color:var(--saa-accent)"><span style="display:block;width:20px;height:28px;border:1.5px solid currentColor;border-radius:var(--saa-radius-2);box-sizing:border-box"></span></span><span class="saa-tile-label">A4</span><span class="saa-tile-meta">856 × 1216</span></button><button class="saa-tile is-compact"><span style="height:44px;display:grid;place-items:center;color:var(--saa-muted2)"><span style="display:block;width:19px;height:28px;border:1.5px solid currentColor;border-radius:var(--saa-radius-2);box-sizing:border-box"></span></span><span class="saa-tile-label">2:3</span><span class="saa-tile-meta">840 × 1256</span></button><button class="saa-tile is-compact"><span style="height:44px;display:grid;place-items:center;color:var(--saa-muted2)"><span style="display:block;width:17px;height:28px;border:1.5px solid currentColor;border-radius:var(--saa-radius-2);box-sizing:border-box"></span></span><span class="saa-tile-label">Golden</span><span class="saa-tile-meta">808 × 1304</span></button><button class="saa-tile is-compact"><span style="height:44px;display:grid;place-items:center;color:var(--saa-muted2)"><span style="display:block;width:16px;height:28px;border:1.5px solid currentColor;border-radius:var(--saa-radius-2);box-sizing:border-box"></span></span><span class="saa-tile-label">9:16</span><span class="saa-tile-meta">768 × 1368</span></button><button class="saa-tile is-compact"><span style="height:44px;display:grid;place-items:center;color:var(--saa-muted2)"><span style="display:block;width:22px;height:22px;border:1.5px dashed currentColor;border-radius:var(--saa-radius-2);box-sizing:border-box"></span></span><span class="saa-tile-label">Free</span><span class="saa-tile-meta">1024 × 1024</span></button></div></div></div>
</body>
</html>
