<!doctype html>
<html>
<head><meta charset="utf-8"><title>NumberField — preview</title></head>
<body style="margin:0">
<div class="saa-ui" style="padding:16px;background:var(--saa-bg-app);min-height:100%;box-sizing:border-box"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--saa-space-8);"><input class="saa-number" type="number" value="1024" aria-label="Width"><input class="saa-number" type="number" value="28" aria-label="Steps"><input class="saa-number is-over" type="number" value="2400" aria-label="Height over the limit"></div><div style="font-size:11px;color:var(--saa-muted);margin:12px 0 6px">Large (LoRA row weight)</div><div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--saa-space-8);"><input class="saa-number is-lg" type="number" value="0.8" step="0.05" aria-label="Weight"><input class="saa-number is-lg" type="number" value="-1" aria-label="Lowest weight"></div></div>
</body>
</html>
